network_dataset: [ "bclique", "rocketfuel" ]

clique:
  nodes: [ 4, 8, 16, 32, 64 ]
  modes: [ "unit" ]                                             # unit, uniform, equal
  filetype: "DelayHops"                                         # DelayHops, DelayLengths

rocketfuel:
  as_list: [ "1221", "1755", "1239", "3257", "3967", "6461" ]
  filetype: "DelayLength"                                       # DelayHops, DelayLengths

runs: 5
metric: "hops"                                                  # hops, lengths
append: false                                                   # append on existing output file

simulator: "build/Simulator"

protocols:
  rpbob:
    flags: [ "-R" ]
    period: true
    notif: false
  rpbob_notif:
    flags: [ "-R", "notif" ]
    period: true
    notif: true
  bgp:
    flags: [ "-G" ]
    period: false
    notif: false
  rcn:
    flags: [ "-C" ]
    period: false
    notif: false